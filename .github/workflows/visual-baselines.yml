name: Generate visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: generate-linux-baselines
        run: PLAYWRIGHT_USE_PRODUCTION=1 CI=1 pnpm exec playwright test --project=visual --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: yami-design-system-linux-visual-baselines
          path: tests/visual/canvas.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
