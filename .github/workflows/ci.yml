name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: yami-freeze
            command: pnpm check:yami-freeze
          - check: typecheck
            command: pnpm typecheck
          - check: lint
            command: pnpm lint
          - check: unit
            command: pnpm test
          - check: generated-drift
            command: pnpm check:generated
          - check: package-boundaries
            command: pnpm check:boundaries
          - check: build
            command: pnpm --filter @yami/topic-generator-app build && pnpm --filter @yami/canvas build
          - check: storybook
            command: pnpm --filter @yami/storybook build
          - check: storybook-interactions
            command: pnpm test:storybook
            installBrowser: true
          - check: docgen
            command: pnpm --filter @yami/storybook build && pnpm check:docgen
          - check: changeset
            command: pnpm changeset:status
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.check == 'changeset' && '0' || '1' }}
      - name: fetch-changeset-base
        if: matrix.check == 'changeset' && github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install-storybook-browser
        if: matrix.installBrowser == true
        run: pnpm exec playwright install --with-deps chromium
      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  browser:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: a11y
            command: pnpm test:a11y
          - check: e2e
            command: pnpm test:e2e
          - check: visual
            command: pnpm test:visual
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}
      - name: browser-artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.check }}-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docsite:
    name: docsite
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: content-and-token-validation
        run: pnpm check:docsite-content
      - name: typecheck-and-unit-tests
        run: pnpm --filter @yami/docsite typecheck && pnpm test:docsite
      - name: production-build
        run: pnpm build:docsite
      - name: browser-and-accessibility-tests
        run: pnpm test:docsite:e2e
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
      - name: configure-lighthouse-browser
        run: |
          browser_path=$(node -p "require('@playwright/test').chromium.executablePath()")
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: lighthouse-budgets
        run: pnpm test:docsite:lighthouse
      - name: repository-validation
        run: pnpm validate
      - name: docsite-browser-artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docsite-playwright-results
          path: |
            apps/docsite/playwright-report
            apps/docsite/test-results
            apps/docsite/.lighthouseci
          if-no-files-found: ignore
          retention-days: 7
