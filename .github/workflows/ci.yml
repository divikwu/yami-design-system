name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: yami-freeze
            command: pnpm check:yami-freeze
          - check: typecheck
            command: pnpm typecheck
          - check: lint
            command: pnpm lint
          - check: unit
            command: pnpm test
          - check: generated-drift
            command: pnpm check:generated
          - check: package-boundaries
            command: pnpm check:boundaries
          - check: build
            command: pnpm --filter @yami/canvas build
          - check: storybook
            command: pnpm --filter @yami/storybook build
          - check: storybook-interactions
            command: pnpm test:storybook
            installBrowser: true
          - check: docgen
            command: pnpm --filter @yami/storybook build && pnpm check:docgen
          - check: changeset
            command: pnpm changeset:status
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.check == 'changeset' && '0' || '1' }}
      - name: fetch-changeset-base
        if: matrix.check == 'changeset' && github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install-storybook-browser
        if: matrix.installBrowser == true
        run: pnpm exec playwright install --with-deps chromium
      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  browser:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: a11y
            command: pnpm test:a11y
          - check: e2e
            command: pnpm test:e2e
          - check: visual
            command: pnpm test:visual --update-snapshots
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}
      - name: visual-baselines
        if: matrix.check == 'visual'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/canvas.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 1
      - name: browser-artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.check }}-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
